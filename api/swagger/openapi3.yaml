servers:
  - url: //localhost:8080/api
components:
  securitySchemes:
    BearerAuth:
      description: 'JWT token or API key. Format: "Bearer {token}"'
      in: header
      name: Authorization
      type: apiKey
    SCIMAuth:
      description: 'SCIM bearer token. Format: "Bearer {scim_token}"'
      in: header
      name: Authorization
      type: apiKey
  schemas:
    apikeys.APIKeyResponse:
      properties:
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        key_prefix:
          type: string
        last_used_at:
          type: string
      type: object
    apikeys.CreateAPIKeyRequest:
      properties:
        description:
          type: string
      type: object
    apikeys.CreateAPIKeyResponse:
      properties:
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        key:
          type: string
        key_prefix:
          type: string
      type: object
    auth.AuthResponse:
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/auth.UserResponse"
      type: object
    auth.ChangePasswordRequest:
      properties:
        current_password:
          type: string
        new_password:
          minLength: 8
          type: string
      required:
        - current_password
        - new_password
      type: object
    auth.LoginRequest:
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
      type: object
    auth.RegisterRequest:
      properties:
        email:
          type: string
        name:
          type: string
        password:
          minLength: 8
          type: string
      required:
        - email
        - name
        - password
      type: object
    auth.UserResponse:
      properties:
        email:
          type: string
        has_password:
          type: boolean
        id:
          type: string
        name:
          type: string
        system_role:
          type: string
      type: object
    groups.AddMemberRequest:
      properties:
        email:
          type: string
        role:
          enum:
            - admin
            - member
          type: string
      required:
        - email
        - role
      type: object
    groups.CreateGroupRequest:
      properties:
        description:
          type: string
        name:
          type: string
        organization_id:
          description: Optional - defaults to org from context or global
          type: string
      required:
        - name
      type: object
    groups.GroupResponse:
      properties:
        description:
          type: string
        id:
          type: string
        member_count:
          type: integer
        name:
          type: string
        role:
