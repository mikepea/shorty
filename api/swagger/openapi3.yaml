          type: string
      type: object
    groups.MemberResponse:
      properties:
        email:
          type: string
        id:
          type: string
        name:
          type: string
        role:
          type: string
      type: object
    groups.UpdateGroupRequest:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    groups.UpdateMemberRequest:
      properties:
        role:
          enum:
            - admin
            - member
          type: string
      required:
        - role
      type: object
    links.CreateLinkRequest:
      properties:
        description:
          type: string
        is_public:
          type: boolean
        is_unread:
          type: boolean
        slug:
          maxLength: 50
          minLength: 1
          type: string
        title:
          type: string
        url:
          type: string
      required:
        - url
      type: object
    links.LinkResponse:
