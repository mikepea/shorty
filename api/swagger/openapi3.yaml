        created_at:
          type: string
        description:
          type: string
        group_id:
          type: string
        id:
          type: string
        is_public:
          type: boolean
        is_unread:
          type: boolean
        slug:
          type: string
        title:
          type: string
        updated_at:
          type: string
        url:
          type: string
