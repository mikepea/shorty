openapi: 3.0.0
info:
  contact:
    name: Shorty Support
    url: https://github.com/mikepea/shorty
  description: A modern URL shortener with team collaboration, SSO, and SCIM support.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Shorty API
  version: "1.0"
paths:
  /api-keys:
    get:
      description: Get all API keys for the authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/apikeys.APIKeyResponse"
                type: array
      security:
        - BearerAuth: []
      summary: List API keys
      tags:
        - api-keys
    post:
      description: Create a new API key for the authenticated user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/apikeys.CreateAPIKeyRequest"
        description: API key details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apikeys.CreateAPIKeyResponse"
      security:
        - BearerAuth: []
      summary: Create an API key
      tags:
        - api-keys
  "/api-keys/{id}":
    delete:
      description: Delete an API key by ID
      parameters:
        - description: API Key ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: API key deleted
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: API key not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Delete an API key
      tags:
        - api-keys
  /auth/login:
    post:
      description: Authenticate with email and password to receive a JWT token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.LoginRequest"
        description: Login credentials
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Login
      tags:
        - auth
  /auth/logout:
    post:
      description: Logout the current user (client-side token invalidation)
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Logout
      tags:
        - auth
  /auth/me:
    get:
      description: Get the authenticated user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.UserResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Get current user
      tags:
        - auth
  /auth/password:
    put:
      description: Change the password for the authenticated user (requires existing
        password)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.ChangePasswordRequest"
        description: Password change details
        required: true
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Validation error or SSO-only user
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "401":
          description: Authentication required or wrong current password
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Change password
      tags:
        - auth
  /auth/register:
    post:
      description: Create a new user account and receive a JWT token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth.RegisterRequest"
        description: Registration details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/auth.AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      summary: Register a new user
      tags:
        - auth
  /groups:
    get:
      description: Get all groups the current user is a member of
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/groups.GroupResponse"
                type: array
      security:
        - BearerAuth: []
      summary: List groups
      tags:
        - groups
    post:
      description: Create a new group with the current user as admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/groups.CreateGroupRequest"
        description: Group details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/groups.GroupResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Create a group
      tags:
        - groups
  "/groups/{id}":
    delete:
      description: Delete a group (requires admin role in group)
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group deleted
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Delete a group
      tags:
        - groups
    get:
      description: Get details of a specific group
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/groups.GroupResponse"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Get a group
      tags:
        - groups
    put:
      description: Update a group (requires admin role in group)
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/groups.UpdateGroupRequest"
        description: Updated group details
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/groups.GroupResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Update a group
      tags:
        - groups
  "/groups/{id}/links":
    get:
      description: Get all links belonging to a specific group
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Filter by unread status
          in: query
          name: is_unread
          schema:
            type: boolean
        - description: Filter by public status
          in: query
          name: is_public
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/links.LinkResponse"
                type: array
        "400":
          description: Invalid group ID
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: List links in a group
      tags:
        - links
    post:
      description: Create a new shortened link in a group
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/links.CreateLinkRequest"
        description: Link details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/links.LinkResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Create a link
      tags:
        - links
  "/groups/{id}/members":
    get:
      description: Get all members of a group
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/groups.MemberResponse"
                type: array
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: List group members
      tags:
        - groups
    post:
      description: Add a user to a group (requires admin role)
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/groups.AddMemberRequest"
        description: Member details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/groups.MemberResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: User not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "409":
          description: User is already a member
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Add group member
      tags:
        - groups
  "/groups/{id}/members/{userId}":
    delete:
      description: Remove a member from a group (requires admin role)
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: User ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Remove group member
      tags:
        - groups
    put:
      description: Update a member's role in a group (requires admin role)
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: User ID
          in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/groups.UpdateMemberRequest"
        description: Updated member details
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/groups.MemberResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Update group member
      tags:
        - groups
  "/groups/{id}/tags":
    get:
      description: Get all tags used in a specific group
      parameters:
        - description: Group ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/tags.TagResponse"
                type: array
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: List tags in a group
      tags:
        - tags
  /links:
    get:
      description: Search links across all groups the user has access to
      parameters:
        - description: Search query (searches title, description, URL)
          in: query
          name: q
          schema:
            type: string
        - description: Filter by unread status
          in: query
          name: is_unread
          schema:
            type: boolean
        - description: Filter by public status
          in: query
          name: is_public
          schema:
            type: boolean
        - description: Filter by group ID
          in: query
          name: group_id
          schema:
            type: string
        - description: Filter by tag name
          in: query
          name: tag
          schema:
            type: string
        - description: Max results (default 50, max 100)
          in: query
          name: limit
          schema:
            type: integer
        - description: Offset for pagination
          in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/links.LinkResponse"
                type: array
      security:
        - BearerAuth: []
      summary: Search links
      tags:
        - links
  "/links/{slug}":
    delete:
      description: Delete a link by slug
      parameters:
        - description: Link slug
          in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Link deleted
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Delete a link
      tags:
        - links
    get:
      description: Get link details by its short slug
      parameters:
        - description: Link slug
          in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/links.LinkResponse"
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Get a link by slug
      tags:
        - links
    put:
      description: Update an existing link by slug
      parameters:
        - description: Link slug
          in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/links.UpdateLinkRequest"
        description: Updated link details
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/links.LinkResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Update a link
      tags:
        - links
  "/links/{slug}/tags":
    get:
      description: Get all tags for a specific link
      parameters:
        - description: Link slug
          in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/tags.TagResponse"
                type: array
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Get link tags
      tags:
        - tags
    put:
      description: Replace all tags on a link
      parameters:
        - description: Link slug
          in: path
          name: slug
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/tags.SetTagsRequest"
        description: Tags to set
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/tags.TagResponse"
                type: array
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Set link tags
      tags:
        - tags
  "/links/{slug}/tags/{tag}":
    delete:
      description: Remove a tag from a link
      parameters:
        - description: Link slug
          in: path
          name: slug
          required: true
          schema:
            type: string
        - description: Tag name
          in: path
          name: tag
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tag removed
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "404":
          description: Link or tag not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Remove tag from link
      tags:
        - tags
    post:
      description: Add a single tag to a link
      parameters:
        - description: Link slug
          in: path
          name: slug
          required: true
          schema:
            type: string
        - description: Tag name
          in: path
          name: tag
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/tags.TagResponse"
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Add tag to link
      tags:
        - tags
  /organizations:
    get:
      description: Get all organizations the current user is a member of
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/organizations.OrgResponse"
                type: array
      security:
        - BearerAuth: []
      summary: List organizations
      tags:
        - organizations
    post:
      description: Create a new organization with the current user as admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/organizations.CreateOrgRequest"
        description: Organization details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizations.OrgResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Create an organization
      tags:
        - organizations
  "/organizations/{id}":
    delete:
      description: Delete an organization (requires admin role)
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization deleted
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Delete an organization
      tags:
        - organizations
    get:
      description: Get details of a specific organization
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizations.OrgResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Get an organization
      tags:
        - organizations
    put:
      description: Update an organization (requires admin role)
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/organizations.UpdateOrgRequest"
        description: Updated organization details
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/organizations.OrgResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: Update an organization
      tags:
        - organizations
  "/organizations/{id}/members":
    get:
      description: Get all members of an organization
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/organizations.MemberResponse"
                type: array
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
      security:
        - BearerAuth: []
      summary: List organization members
      tags:
        - organizations
    post:
      description: Add a user to an organization (requires admin role)
      parameters:
        - description: Organization ID
          in: path
          name: id
          required: true
          schema:
